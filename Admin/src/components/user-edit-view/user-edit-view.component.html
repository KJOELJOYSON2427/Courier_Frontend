<div class="page-wrapper">
  <div class="card">

    <!-- Header -->
    <div class="card-header">
      <div>
        <h2>User Profile</h2>
        <p class="subtitle">View and manage user information</p>
      </div>

      <span class="mode" [class.edit]="isEditMode">
        {{ isEditMode ? 'Editing' : 'Viewing' }}
      </span>
    </div>

    <!-- Form -->
    <form
      [formGroup]="userForm"
      class="form-grid"
      [class.readonly]="!isEditMode">

      <!-- Personal Info -->
      <h3 class="section-title">Personal Information</h3>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="fullName">
        <small class="error"
          *ngIf="userForm.get('fullName')?.invalid && userForm.get('fullName')?.touched">
          Full name is required
        </small>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
        <small class="error"
          *ngIf="userForm.get('email')?.invalid && userForm.get('email')?.touched">
          Enter a valid email
        </small>
      </div>

      <div class="form-group">
        <label>Country</label>
        <input type="text" formControlName="country">
      </div>

      <div class="form-group">
        <label>Address</label>
        <input type="text" formControlName="address">
      </div>

      <div class="form-group">
        <label>Age</label>
        <input type="number" formControlName="age">
      </div>

      <!-- Additional Info -->
      <h3 class="section-title">Additional Details</h3>

      <div class="form-group full-width">
        <label>Note</label>
        <textarea formControlName="note"></textarea>
      </div>

      <div class="form-group full-width">
        <label>Feedback</label>
        <textarea formControlName="feedBack"></textarea>
      </div>

      <div class="form-group">
        <label>Status</label>
        <select formControlName="status">
          <option [value]="0">Inactive</option>
          <option [value]="1">Active</option>
        </select>
      </div>

      <div class="form-group">
        <label>Role</label>
        <select formControlName="role">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
      </div>

      <!-- Actions -->
      <div class="actions full-width">

        <button
          *ngIf="!isEditMode"
          type="button"
          class="btn edit"
          (click)="enableEdit()">
          ✏️ Edit
        </button>

        <button
          *ngIf="isEditMode"
          type="button"
          class="btn cancel"
          (click)="cancelEdit()">
          Cancel
        </button>

        <button
          *ngIf="isEditMode"
          type="button"
          class="btn save"
          [disabled]="!userForm.dirty || userForm.invalid || loading"
          (click)="save()">
          <span *ngIf="!loading">💾 Save Changes</span>
          <span *ngIf="loading">Saving...</span>
        </button>

      </div>
    </form>

    <!-- Success Toast -->
    <div class="toast success" *ngIf="showSuccess">
      ✅ User updated successfully
    </div>

  </div>
</div>
