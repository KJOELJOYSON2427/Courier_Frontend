<div class="w-[400 px] flex flex-col bg-linear-to-br from-white to-gray-50 
backdrop-blur-xl shadow-2xl rounded-3xl p-8 border border-gray-100 hover:shadow-3xlhover:shadow-3xl
transition-all duration-300
">

    <!-- Header with icon -->
    <div class="flex items-center gap-3 mb-6">
        <div
            class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
            <svg class="w-5 h-5">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z">

                </path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z">
                </path>

            </svg>
        </div>
        <h2 class="text-2xl font-bold bg-linear-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent">

            Parcel Distribution
        </h2>
    </div>



    <!-- Chart container with glow effect -->
    <div class="relative flex items-center justify-center h-[320px] bg-white rounded-2xl px-6 shadow-inner">

        <!-- Decorative gradient background -->
        <div class="absolute inset-0 bg-gradient-to-br from-blue-50 via-purple-50 to-pink-50 rounded-2xl opacity-50">
        </div>

        <!-- Chart -->
        <div class="relative w-full h-full flex items-center justify-center">
           
            <canvas
             baseChart 
             [data]="pieChartData"
              [type]="'pie'" 
              [options]="pieChartOptions" 
              class="drop-shadow-lg"></canvas>
        </div>
    </div>


    <!-- Optional: Stats summary -->

    <div class="grid grid-cols-2 gap-3 mt-6 pt-6 border-t border-gray-200">
           <div class="text-center p-3 bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl">
            <p class="text-xs font-medium text-gray-600">Total Parcels</p>
            <p class="text-2xl font-bold text-green-600">600</p>
           </div>
        <div class="text-center p-3 bg-gradient-to-br from-blue-50 to-cyan-50 rounded-xl">
            <p class="text-xs font-medium text-gray-600">Delivery Rate</p>
            <p class="text-2xl font-bold text-blue-600">50%</p></div>
    </div>
</div>
