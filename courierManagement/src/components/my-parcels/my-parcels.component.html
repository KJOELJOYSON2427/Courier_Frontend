<div class="min-h-[calc(100vh-140px)]
            bg-gray-50 dark:bg-gray-950
            text-gray-900 dark:text-gray-100
            px-6 py-8">

  <!-- ================= HEADER ================= -->
  <div class="relative z-50 flex justify-between items-center mb-12 pb-8">

    <h1 class="text-3xl font-bold">My Parcels History</h1>

    <div class="flex items-center gap-4
                bg-white/70 dark:bg-gray-900/70
                backdrop-blur-sm
                px-5 py-3
                rounded-2xl
                shadow-md">

      <!-- Avatar -->
      <div class="w-12 h-12
                  bg-gradient-to-br from-amber-400 to-yellow-600
                  rounded-full
                  flex items-center justify-center
                  text-white text-xl font-bold">
        A
      </div>

      <!-- Profile Dropdown -->
      <div class="relative" #profileMenu>

        <!-- Trigger -->
        <div
          (click)="toggleDropdown(); $event.stopPropagation()"
          class="cursor-pointer select-none">

          <p class="text-sm text-gray-600 dark:text-gray-400">
            Welcome back
          </p>
          <p class="font-semibold text-black dark:text-white">
            Alok Mondala
          </p>
        </div>

        <!-- Dropdown -->
        <div
          *ngIf="isOpen"
           (click)="$event.stopPropagation()"
          class="absolute right-0 top-full mt-4 w-48
                 bg-white/95 dark:bg-gray-800/95
                 backdrop-blur-md
                 border border-gray-200/60 dark:border-gray-700/60
                 rounded-2xl
                 shadow-2xl
                 overflow-hidden
                 z-50
                 origin-top-right">

          <!-- Arrow -->
          <div class="absolute right-6 -top-2">
            <div class="w-0 h-0
                        border-l-8 border-l-transparent
                        border-r-8 border-r-transparent
                        border-b-8
                        border-b-white/95 dark:border-b-gray-800/95">
            </div>
          </div>

          <!-- Items -->
          <a
            routerLink="/profileEdit"
            (click)="closeDropdown()"
            class="flex items-center gap-3 px-5 py-3 text-sm
                   hover:bg-gray-100/70 dark:hover:bg-gray-700/70 transition">
            <i class="fas fa-user text-amber-500"></i>
            Profile
          </a>

          <a
            routerLink="/parcels"
             
            class="flex items-center gap-3 px-5 py-3 text-sm
                   hover:bg-gray-100/70 dark:hover:bg-gray-700/70 transition">
            <i class="fas fa-box text-amber-500"></i>
            All Parcels
          </a>

          <button
            class="flex w-full items-center gap-3 px-5 py-3 text-sm text-left
                   hover:bg-gray-100/70 dark:hover:bg-gray-700/70 transition">
            <i class="fas fa-file-alt text-amber-500"></i>
            Statements
          </button>

          <hr class="border-gray-200/60 dark:border-gray-700/60">

          <button
            class="flex w-full items-center gap-3 px-5 py-3 text-sm text-left
                   text-rose-600
                   hover:bg-rose-50 dark:hover:bg-rose-900/20 transition">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PARCEL LIST ================= -->
  <div class="relative z-0 space-y-8 max-w-4xl mx-auto">

    <div *ngFor="let parcel of parcels; let i = index" class="relative pl-10">

      <!-- Timeline Line -->
      <div *ngIf="i < parcels.length - 1"
           class="absolute left-5 top-12 bottom-0 w-0.5
                  bg-gradient-to-b from-amber-400 to-transparent
                  dark:from-amber-600">
      </div>

      <!-- Timeline Dot -->
      <div class="absolute left-0 top-4 w-10 h-10
                  bg-gradient-to-br from-amber-400 to-yellow-600
                  dark:from-amber-500 dark:to-yellow-700
                  rounded-full flex items-center justify-center shadow-lg">
        <i class="fas fa-box text-white text-lg"></i>
      </div>

      <!-- Card -->
      <div class="bg-white dark:bg-gray-900/80
      
                  backdrop-blur-md
                  border border-gray-200 dark:border-gray-800
                  rounded-2xl shadow-xl p-6
                  hover:shadow-2xl transition"
                  (click)="navigateToParcelDetail(parcel.trackingNumber)"
                  >

        <div class="flex flex-col md:flex-row md:justify-between gap-6">

          <!-- Details -->
          <div class="grid grid-cols-2 gap-4 text-sm flex-1">
            <div>
              <p class="text-gray-500 dark:text-gray-400">From</p>
              <p class="font-medium text-lg">{{ parcel.from }}</p>
            </div>
            <div>
              <p class="text-gray-500 dark:text-gray-400">To</p>
              <p class="font-medium text-lg">{{ parcel.to }}</p>
            </div>
            <div>
              <p class="text-gray-500 dark:text-gray-400">Weight</p>
              <p class="font-medium">{{ parcel.weight }}</p>
            </div>
            <div>
              <p class="text-gray-500 dark:text-gray-400">Date</p>
              <p class="font-medium">{{ parcel.date }}</p>
            </div>
            <div>
              <p class="text-gray-500 dark:text-gray-400">Sender</p>
              <p class="font-medium">{{ parcel.sender }}</p>
            </div>
          </div>

          <!-- Status -->
          <div class="flex flex-col items-end gap-3">
            <span
              [appParcelStatus]="parcel.status"
              class="inline-flex items-center gap-2 px-5 py-2
                     rounded-full text-white font-semibold text-sm shadow-md">
              <i class="fas fa-truck-loading"></i>
              {{ parcel.status }}
            </span>

            <p class="text-xs text-gray-500 dark:text-gray-400">
              Parcel ID: #12345
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= EMPTY STATE ================= -->
  <div *ngIf="!parcels || parcels.length === 0"
       class="text-center py-20">
    <i class="fas fa-box-open text-6xl text-gray-300 dark:text-gray-700 mb-6"></i>
    <p class="text-xl text-gray-500 dark:text-gray-400">No parcels yet</p>
    <p class="text-gray-400 dark:text-gray-500 mt-2">
      Your delivery history will appear here
    </p>
  </div>
</div>
