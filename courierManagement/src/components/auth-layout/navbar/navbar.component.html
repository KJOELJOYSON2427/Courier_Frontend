<nav class=" dark:bg-gray-900 px-10 py-4 flex bg-[#e9eb77] justify-between items-center">

  <div class="font-bold text-black dark:text-white">
    <img src="../../../assets/logo.png" width="120px" height="130px">
  </div>

  <button
    (click)="themeService.toggleTheme()"
    class="dark:bg-black bg-white text-white px-4 py-2 rounded w-20 h-12 p-4">

    <!-- Icon based on current theme -->
    <span *ngIf="themeService.theme() === 'light'">🌞</span>
    <span *ngIf="themeService.theme() === 'dark'">🌙</span>
    <!-- <span *ngIf="themeService.theme() === 'system'">🖥️</span> -->

  </button>

</nav>
